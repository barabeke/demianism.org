<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">

  <title>Demian AI — demianism.org</title>
  <meta name="description" content="Demian, the Demianist AI companion, has moved to demian.demianism.org.">

  <link rel="canonical" href="https://demian.demianism.org/">
  <meta http-equiv="refresh" content="0; url=https://demian.demianism.org/">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      font-family: 'Libre Baskerville', serif;
      color: #d4d4f0;
      font-size: 18px;
      line-height: 1.8;
      background:
        radial-gradient(circle at 20% 20%, rgba(53,50,126,0.28), transparent 60%),
        radial-gradient(circle at 80% 30%, rgba(53,50,126,0.22), transparent 65%),
        radial-gradient(circle at 50% 80%, rgba(53,50,126,0.35), transparent 70%),
        #000000;
    }

    .brand { height: 26px; width: auto; display: block; margin: 0 auto 28px; }

    p { margin: 0 0 26px; color: #a29ef1; }

    a.btn {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #cfcfd4;
      background: #35327e;
      border: 1px solid #6864bb55;
      border-radius: 30px;
      padding: 14px 30px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    a.btn:hover {
      background: #6864bb;
      color: #ffffff;
      box-shadow: 0 0 26px rgba(104,100,187,0.55);
    }
  </style>
</head>

<body>
  <img src="demian-ai-brand.png" alt="Demian AI" class="brand">
  <p>Demian now lives at <strong>demian.demianism.org</strong>. Taking you there&hellip;</p>
  <a class="btn" href="https://demian.demianism.org/">Talk to Demian</a>

  <script>window.location.replace('https://demian.demianism.org/');</script>
</body>
</html>
